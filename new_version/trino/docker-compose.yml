services:
  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Helper to create the 'warehouse' bucket on startup
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 admin password;
      mc mb minio/warehouse;
      exit 0;
      "

  polaris:
    image: apache/polaris:1.3.0-incubating
    container_name: polaris
    ports:
      - "8181:8181"
      - "8182:8182"
    networks:
      - polaris-net
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_ENDPOINT_URL_STS: http://minio:9000
      POLARIS_BOOTSTRAP_CREDENTIALS: DEMO,root,secret
      POLARIS_FEATURES_ALLOW_SETTING_S3_ENDPOINTS: "true"
      POLARIS_FEATURES_ALLOW_S3_SELECT_UNSUPPORTED_STORAGE: "true"
      polaris.realm-context.realms: DEMO
      polaris.features.DROP_WITH_PURGE_ENABLED: "true"
    volumes:
      - polaris-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8182/q/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  polaris-net:
    driver: bridge

volumes:
  polaris-data: